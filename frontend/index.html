<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>售后客服Agent</title>
    <link rel="stylesheet" href="/src/style.css?v=20261022" />
  </head>
  <body>
    <div id="app" class="app-shell">
      <aside class="sidebar">
        <div class="brand"><span class="brand-mark" aria-hidden="true">●</span><span>售后客服Agent</span></div>
        <div class="sidebar-section">
          <div class="sidebar-label">当前会话</div>
          <div id="thread-label" class="thread-label">新会话</div>
        </div>
        <nav class="service-nav" aria-label="售后服务">
          <a href="#/chat" data-route="chat">服务对话</a>
          <a href="#/refund" data-route="refund">退款确认</a>
          <a href="#/order-address" data-route="order-address">修改收货地址</a>
          <a href="#/workbench" data-route="workbench" hidden>客服工作台</a>
        </nav>
        <button id="new-thread" class="secondary-button" type="button">新建会话</button>
        <div class="sidebar-bottom">
          <span id="identity-label">未登录</span>
          <button id="logout" class="text-button" type="button" hidden>退出</button>
        </div>
      </aside>
      <main class="main">
        <header class="topbar"><span>客户服务</span><span id="connection-label" class="connection-label">连接中</span></header>
        <section id="login-panel" class="login-panel" hidden>
          <h1>登录售后服务</h1>
          <form id="login-form">
            <label for="account-id">测试账号</label>
            <input id="account-id" name="account_id" autocomplete="username" required placeholder="输入预置账号 ID" />
            <button class="primary-button" type="submit">登录</button>
          </form>
          <p id="login-error" class="error-text" role="alert" hidden></p>
        </section>
        <section id="chat-panel" class="chat-panel" hidden>
          <div id="messages" class="messages" aria-live="polite"></div>
          <div id="task-banner" class="task-banner" role="status" hidden></div>
          <form id="composer" class="composer">
            <label class="sr-only" for="message">消息</label>
            <textarea id="message" name="message" rows="2" maxlength="4000" placeholder="输入售后问题" required></textarea>
            <div class="composer-actions">
              <label class="async-toggle"><input id="async-mode" type="checkbox" /> 后台处理</label>
              <button id="send-button" class="primary-button" type="submit">发送</button>
            </div>
          </form>
          <p id="chat-error" class="error-text" role="alert" hidden></p>
        </section>
        <p id="route-feedback" class="route-feedback" role="status" hidden></p>
        <section id="page-root" class="page-root" hidden></section>
      </main>
    </div>
    <script type="module" src="/src/pages/chat/app.js?v=20261022"></script>
    <script type="module" src="/src/pages/customer-app.js?v=20261022"></script>
  </body>
</html>
