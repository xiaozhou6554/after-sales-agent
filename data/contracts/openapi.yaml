      - window_end
      - filters
      properties:
        window_start:
          type: string
          format: date-time
        window_end:
          type: string
          format: date-time
        filters:
          type: object
          properties:
            product_id:
              type: string
            sku_id:
              type: string
            source_system:
              type: string
            correlation_id:
              type: string
            trace_id:
              type: string
            operation_id:
              type: string
            reason_code:
              type: string
          additionalProperties: false
        reason:
          type: string
          minLength: 1
          maxLength: 500
      additionalProperties: false
    ChatRequest:
      type: object
      required:
      - schema_version
      - message
      - thread_id
      - customer_id
      - business_refs
      properties:
        schema_version:
          type: string
          const: '1.0'
        message:
