openapi: 3.1.0
info:
  title: After-sales Agent Gateway
  version: 1.0.0
  description: HTTP contract for the complete first release. AuthContext is derived from the authenticated server session
    and is never accepted in request bodies.
servers:
- url: https://{tenant-host}/api/v1
  variables:
    tenant-host:
      default: localhost
security:
- bearerAuth: []
paths:
  /chat:
    post:
      operationId: submitChat
      parameters:
      - $ref: '#/components/parameters/OptionalIdempotencyKey'
      - $ref: '#/components/parameters/PreferAsync'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ChatRequest'
      responses:
        '200':
          description: Synchronous APIResponse or an already completed idempotent task
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SubmitChatResult'
        '202':
          description: Persisted task accepted when Prefer is respond-async; Idempotency-Key is required
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GetTaskResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /tasks/{task_id}:
    get:
      operationId: getTask
      parameters:
      - name: task_id
        in: path
        required: true
        schema:
          type: string
          minLength: 1
      responses:
        '200':
          description: Authorized APIResponse with data.task; pending tasks have no fabricated result
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GetTaskResponse'
        '404':
          $ref: '#/components/responses/SafeNotFound'
  /tickets:
    post:
      operationId: createTicket
      parameters:
      - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateTicketRequest'
      responses:
        '201':
          description: Created after validating the persisted user confirmation; returns the real ticket state
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CreateTicketResult'
        '409':
          description: Confirmation
          revision: null
          or idempotency conflict: null
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ApiError'
  /tickets/{ticket_id}:
    get:
      operationId: getTicket
      parameters:
      - name: ticket_id
        in: path
        required: true
        schema:
          type: string
          minLength: 1
      responses:
        '200':
          description: Authorized ticket view
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GetTicketResult'
        '404':
          $ref: '#/components/responses/SafeNotFound'
  /tickets/{ticket_id}/messages:
    post:
      operationId: addTicketMessage
      parameters:
      - name: ticket_id
        in: path
        required: true
        schema:
          type: string
          minLength: 1
      - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TicketMessageRequest'
      responses:
        '200':
          description: Message added through the authorized ticket use case
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AddTicketMessageResult'
        '409':
          description: Confirmation or expected revision conflict
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ApiError'
  /ticket-confirmations:
    post:
      operationId: createTicketConfirmation
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TicketConfirmationRequest'
      responses:
        '201':
          description: Persisted confirmation bound to normalized content
          subject: null
          customer: null
          target: null
          and revision: null
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CreateTicketConfirmationResult'
        '400':
          $ref: '#/components/responses/BadRequest'
  /handoffs:
    post:
      operationId: createHandoff
      parameters:
      - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/HandoffRequest'
      responses:
        '202':
          description: Handoff status based on the persisted operation result
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CreateHandoffResult'
        '409':
          description: Idempotency or resource-state conflict
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ApiError'
  /health/live:
    get:
      operationId: healthLive
      security: []
      responses:
        '200':
          description: Process liveness
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthLiveResult'
  /health/ready:
    get:
      operationId: healthReady
      security: []
      responses:
        '200':
          description: Dependency readiness
          including explicit degraded state: null
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthReadyResult'
        '503':
          description: Not ready or degraded
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ApiError'
  /auth/mock/session:
    post:
      operationId: createMockSession
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MockSessionRequest'
      responses:
        '200':
          description: Session for a predefined development/test account; disabled in production
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CreateMockSessionResult'
        '403':
          $ref: '#/components/responses/Forbidden'
  /me:
    get:
      operationId: getCurrentIdentity
      responses:
        '200':
          description: Authenticated subject
          roles: null
          scopes: null
          and authorized-scope summary: null
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GetCurrentIdentityResult'
  /workbench/customers:
    get:
      operationId: listAuthorizedCustomers
      parameters:
      - name: query
        in: query
        schema:
          type: string
      - $ref: '#/components/parameters/Cursor'
      - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: Paginated customers within the authenticated employee's authorized scope
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ListAuthorizedCustomersResult'
        '403':
          $ref: '#/components/responses/Forbidden'
  /workbench/tickets:
    get:
      operationId: listAuthorizedTickets
      parameters:
      - name: customer_id
        in: query
        schema:
          type: string
      - name: status
        in: query
        schema:
          type: string
      - name: priority
        in: query
        schema:
          type: string
      - name: assigned_to
        in: query
        schema:
          type: string
      - $ref: '#/components/parameters/Cursor'
      - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: Paginated authorized ticket summaries
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ListAuthorizedTicketsResult'
        '403':
          $ref: '#/components/responses/Forbidden'
  /workbench/tickets/{ticket_id}:
    get:
      operationId: getAuthorizedTicketDetail
      parameters:
      - name: ticket_id
        in: path
        required: true
        schema:
          type: string
      responses:
        '200':
          description: Ticket detail available to the authenticated employee, including internal notes
        '404':
          $ref: '#/components/responses/SafeNotFound'
  /workbench/tickets/{ticket_id}/assignment/confirmations:
    post:
      operationId: prepareTicketAssignmentConfirmation
      parameters:
      - name: ticket_id
        in: path
        required: true
        schema:
          type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/WorkbenchAssignmentConfirmationRequest'
      responses:
        '201':
          description: Content-bound staff confirmation challenge
  /workbench/tickets/{ticket_id}/status/confirmations:
    post:
      operationId: prepareTicketStatusConfirmation
      parameters:
      - name: ticket_id
        in: path
        required: true
        schema:
          type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/WorkbenchStatusConfirmationRequest'
      responses:
        '201':
          description: Content-bound staff confirmation challenge
  /workbench/ticket-confirmations/{confirmation_id}/verify:
    post:
      operationId: verifyWorkbenchTicketConfirmation
      parameters:
      - name: confirmation_id
        in: path
        required: true
        schema:
          type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/WorkbenchConfirmationVerifyRequest'
      responses:
        '200':
          description: Confirmation verified for the issuing employee and bound operation
  /workbench/tickets/{ticket_id}/assignment:
    post:
      operationId: assignTicket
      parameters:
      - name: ticket_id
        in: path
        required: true
        schema:
          type: string
      - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AssignTicketRequest'
      responses:
        '200':
          description: Latest ticket assignment and revision
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AssignTicketResult'
        '409':
          description: Revision or team-scope conflict
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '403':
          $ref: '#/components/responses/Forbidden'
  /workbench/tickets/{ticket_id}/status:
    post:
      operationId: changeTicketStatus
      parameters:
      - name: ticket_id
        in: path
        required: true
        schema:
          type: string
      - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ChangeTicketStatusRequest'
      responses:
        '200':
          description: Latest allowed ticket status and revision
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ChangeTicketStatusResult'
        '409':
          description: Invalid transition or revision conflict
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '403':
          $ref: '#/components/responses/Forbidden'
  /workbench/handoffs:
    get:
      operationId: listAuthorizedHandoffs
      parameters:
      - name: status
        in: query
        schema:
          type: string
      - $ref: '#/components/parameters/Cursor'
      - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: Paginated authorized handoff summaries
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ListAuthorizedHandoffsResult'
        '403':
          $ref: '#/components/responses/Forbidden'
  /workbench/handoffs/{handoff_id}/accept:
    post:
      operationId: acceptHandoff
      parameters:
      - name: handoff_id
        in: path
        required: true
        schema:
          type: string
      - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ExpectedRevisionRequest'
      responses:
        '200':
          description: Accepted handoff with assigned employee and ticket reference
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AcceptHandoffResult'
        '409':
          description: Already accepted or revision conflict
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '403':
          $ref: '#/components/responses/Forbidden'
  /workbench/refund-requests:
    get:
      operationId: listReviewableRefunds
      parameters:
      - name: status
        in: query
        schema:
          type: string
      - name: customer_id
        in: query
        schema:
          type: string
      - $ref: '#/components/parameters/Cursor'
      - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: Paginated refund requests authorized for review
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ListReviewableRefundsResult'
        '403':
          $ref: '#/components/responses/Forbidden'
  /workbench/refund-requests/{refund_request_id}/review:
    post:
      operationId: reviewRefund
      parameters:
      - name: refund_request_id
        in: path
        required: true
        schema:
          type: string
      - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RefundReviewRequest'
      responses:
        '200':
          description: Review status and independent funds_status; approval does not prove payment success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReviewRefundResult'
        '409':
          description: Revision or idempotency conflict
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '403':
          $ref: '#/components/responses/Forbidden'
  /workbench/audit:
    get:
      operationId: queryMaskedAudit
      parameters:
      - name: trace_id
        in: query
        schema:
          type: string
      - name: resource_ref
        in: query
        schema:
          type: string
      - $ref: '#/components/parameters/Cursor'
      - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: Paginated masked audit records within the caller's authorized scope
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/QueryMaskedAuditResult'
        '403':
          $ref: '#/components/responses/Forbidden'
  /workbench/after-sales-metrics:
    get:
      operationId: queryWorkbenchAfterSalesMetrics
      description: return_application_item_rate is a separately registered metric but returns blocked and is excluded from
        rankings until its business and finance definition is approved. return_passed_item_rate is the proposed supervisor
        default and is also not production-enabled before approval.
      parameters:
      - name: metric_ids
        in: query
        required: true
        style: form
        explode: true
        schema:
          type: array
          minItems: 1
          items:
            type: string
            enum:
            - return_application_item_rate
            - return_passed_item_rate
            - refund_successful_line_rate
            - refund_goods_amount_rate
      - name: cohort_start
        in: query
        required: true
        schema:
          type: string
          format: date
      - name: cohort_end
        in: query
        required: true
        schema:
          type: string
          format: date
      - name: dimensions
        in: query
        style: form
        explode: true
        schema:
          type: array
          items:
            type: string
            enum:
            - product_id
            - sku_id
            - channel
            - region
            - warehouse
            - reason_code
      - name: filters
        in: query
        style: deepObject
        explode: true
        schema:
          type: object
          properties:
            product_id:
              type: string
            sku_id:
              type: string
            channel:
              type: string
            region:
              type: string
            warehouse:
              type: string
            reason_code:
              type: string
          additionalProperties: false
      - name: min_sample_size
        in: query
        schema:
          type: integer
          minimum: 1
      responses:
        '200':
          description: Authorized metric results. Pending definitions or incomplete data are blocked/excluded from ranking.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MetricResults'
        '403':
          $ref: '#/components/responses/Forbidden'
  /workbench/returns/{return_id}/receipts:
    post:
      operationId: recordReturnReceipt
      description: Warehouse employee operation; the model has no write tool for receiving.
      parameters:
      - name: return_id
        in: path
        required: true
        schema:
          type: string
      - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ReceiptRequest'
      responses:
        '201':
          description: Receipt recorded in the authorized warehouse adapter
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RecordReturnReceiptResult'
        '409':
          description: Revision
          quantity: null
          confirmation: null
          or idempotency conflict: null
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '403':
          $ref: '#/components/responses/Forbidden'
  /workbench/returns/{return_id}/inspections:
    post:
      operationId: recordReturnInspection
      description: Warehouse employee operation; accepted quantity is bounded by received and authorized quantity plus configured
        tolerance.
      parameters:
      - name: return_id
        in: path
        required: true
        schema:
          type: string
      - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/InspectionRequest'
      responses:
        '201':
          description: Inspection recorded; stock disposition is a separate authorized command
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RecordReturnInspectionResult'
        '409':
          description: Revision or quantity conflict
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '403':
          $ref: '#/components/responses/Forbidden'
  /workbench/refund-executions/{execution_id}:
    get:
      operationId: queryRefundExecution
      parameters:
      - name: execution_id
        in: path
        required: true
        schema:
          type: string
      responses:
        '200':
          description: Authoritative execution state; unknown remains unknown until queried
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/QueryRefundExecutionResult'
        '404':
          $ref: '#/components/responses/SafeNotFound'
  /workbench/refund-executions/{execution_id}/execute:
    post:
      operationId: executeRefund
      description: Service-to-service operation. Not exposed to the model or browser. Requires an approved request, bound
        customer confirmation, required warehouse acceptance, fresh authorization and original payment reference.
      parameters:
      - name: execution_id
        in: path
        required: true
        schema:
          type: string
      - $ref: '#/components/parameters/IdempotencyKey'
      responses:
        '202':
          description: Submitted or accepted for processing; not proof of refund success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ExecuteRefundResult'
        '409':
          description: Stale approval
          amount: null
          revision or idempotency conflict: null
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '403':
          $ref: '#/components/responses/Forbidden'
  /investigations/{investigation_id}:
    get:
      operationId: getInvestigation
      parameters:
      - name: investigation_id
        in: path
        required: true
        schema:
          type: string
      responses:
        '200':
          description: Authorized immutable investigation snapshot and findings
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GetInvestigationResult'
        '404':
          $ref: '#/components/responses/SafeNotFound'
  /investigations/{investigation_id}/revisions:
    post:
      operationId: reviseInvestigation
      parameters:
      - name: investigation_id
        in: path
        required: true
        schema:
          type: string
      - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/InvestigationRevisionRequest'
      responses:
        '202':
          description: New immutable investigation revision accepted; earlier revisions remain available
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReviseInvestigationResult'
        '403':
          $ref: '#/components/responses/Forbidden'
  /refund-requests/{refund_request_id}:
    get:
      operationId: getRefundRequest
      parameters:
      - name: refund_request_id
        in: path
        required: true
        schema:
          type: string
      responses:
        '200':
          description: Authorized masked request status; does not imply successful funds transfer
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GetRefundRequestResult'
        '404':
          $ref: '#/components/responses/SafeNotFound'
  /orders/{order_id}/address-changes:
    post:
      operationId: createAddressChange
      parameters:
      - $ref: '#/components/parameters/OrderId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AddressChangeRequest'
      responses:
        '201':
          description: Prepared address change with order version and masked confirmation summary
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CreateAddressChangeResult'
        '409':
          description: Order state or delivery-scope conflict
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ApiError'
  /orders/{order_id}/address-changes/{address_change_id}/confirm:
    post:
      operationId: confirmAddressChange
      parameters:
      - $ref: '#/components/parameters/OrderId'
      - name: address_change_id
        in: path
        required: true
        schema:
          type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OneTimeVerificationRequest'
      responses:
        '201':
          description: Server-issued confirmation bound to identity
          order: null
          operation: null
          address digest: null
          and order revision: null
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ConfirmAddressChangeResult'
        '409':
          description: Expired
          stale: null
          or mismatched confirmation: null
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ApiError'
  /orders/{order_id}/address-changes/{address_change_id}:
    get:
      operationId: getAddressChange
      parameters:
      - $ref: '#/components/parameters/OrderId'
      - name: address_change_id
        in: path
        required: true
        schema:
          type: string
      responses:
        '200':
          description: Authorized actual operation state and masked result
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GetAddressChangeResult'
        '404':
          $ref: '#/components/responses/SafeNotFound'
  /orders/{order_id}/refund-quotes/{quote_id}/confirm:
    post:
      operationId: confirmRefundQuote
      parameters:
      - $ref: '#/components/parameters/OrderId'
      - name: quote_id
        in: path
        required: true
        schema:
          type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OneTimeVerificationRequest'
      responses:
        '201':
          description: Confirmation bound to quote
          amount: null
          currency: null
          policy: null
          order: null
          payment: null
          tenant: null
          and subjects: null
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ConfirmRefundQuoteResult'
        '409':
          description: Quote expired or underlying version changed
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ApiError'
  /orders/{order_id}:
    get:
      operationId: queryOrder
      parameters:
      - $ref: '#/components/parameters/OrderId'
      responses:
        '200':
          description: Authorized order snapshot
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrderSnapshot'
        '404':
          $ref: '#/components/responses/SafeNotFound'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /after-sales/metrics:
    get:
      operationId: queryAfterSalesMetrics
      description: Return the requested metric with approval and quality state. The return application metric is blocked until
        its numerator, denominator, and cohort time are approved by business and finance.
      parameters:
      - name: metric_id
        in: query
        required: true
        schema:
          type: string
          enum:
          - return_application_item_rate
          - return_passed_item_rate
          - refund_successful_line_rate
          - refund_goods_amount_rate
      - name: cohort_start
        in: query
        required: true
        schema:
          type: string
          format: date
      - name: cohort_end
        in: query
        required: true
        schema:
          type: string
          format: date
      - name: dimensions
        in: query
        required: false
        schema:
          type: array
          items:
            type: string
            enum:
            - product_id
            - sku_id
            - channel
            - region
            - warehouse
            - reason_code
      responses:
        '200':
          description: Metric result with numerator, denominator, quality, coverage, watermarks, versions and evidence references
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MetricResult'
        '403':
          $ref: '#/components/responses/Forbidden'
  /investigations:
    post:
      operationId: createInvestigation
      description: Creates an immutable investigation snapshot. It does not modify source business records.
      parameters:
      - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/InvestigationRequest'
      responses:
        '202':
          description: Investigation accepted; response includes investigation_id and snapshot status
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CreateInvestigationResult'
        '400':
          $ref: '#/components/responses/BadRequest'
        '403':
          $ref: '#/components/responses/Forbidden'
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  parameters:
    OrderId:
      name: order_id
      in: path
      required: true
      schema:
        type: string
        minLength: 1
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      schema:
        type: string
        minLength: 16
        maxLength: 128
    OptionalIdempotencyKey:
      name: Idempotency-Key
      in: header
      required: false
      description: Required when Prefer contains respond-async; same key and changed request return 409
      schema:
        type: string
        minLength: 16
        maxLength: 128
    PreferAsync:
      name: Prefer
      in: header
      required: false
      description: respond-async requests durable immediate acceptance; omission keeps synchronous chat
      schema:
        type: string
        const: respond-async
    Cursor:
      name: cursor
      in: query
      required: false
      schema:
        type: string
        minLength: 1
    Limit:
      name: limit
      in: query
      required: false
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 20
  responses:
    SafeNotFound:
      description: Same public response for absent and inaccessible resources
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    Unauthorized:
      description: Authentication is missing or invalid
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ApiError'
    Forbidden:
      description: Authenticated principal is not authorized for this scope
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ApiError'
    BadRequest:
      description: Request violates the published schema or business preconditions
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ApiError'
  schemas:
    WorkbenchAssignmentConfirmationRequest:
      type: object
      required: [schema_version, assigned_to, expected_revision]
      properties:
        schema_version:
          type: string
          const: '1.0'
        assigned_to:
          type: string
          minLength: 1
          maxLength: 64
        expected_revision:
          type: integer
          minimum: 1
      additionalProperties: false
    WorkbenchStatusConfirmationRequest:
      type: object
      required: [schema_version, target_status, reason, expected_revision]
      properties:
        schema_version:
          type: string
          const: '1.0'
        target_status:
          type: string
          enum: [open, in_progress, resolved, closed]
        reason:
          type: string
          minLength: 1
          maxLength: 1000
        expected_revision:
          type: integer
          minimum: 1
      additionalProperties: false
    WorkbenchConfirmationVerifyRequest:
      type: object
      required: [schema_version, challenge]
      properties:
        schema_version:
          type: string
          const: '1.0'
        challenge:
          type: string
          minLength: 1
          maxLength: 128
      additionalProperties: false
    Problem:
      type: object
      required:
      - type
      - title
      - status
      - request_id
      properties:
        type:
          type: string
        title:
          type: string
          const: Resource unavailable
        status:
          type: integer
          const: 404
        request_id:
          type: string
      additionalProperties: false
    Money:
      type: object
      required:
      - amount_minor
      - currency
      properties:
        amount_minor:
          type: integer
          minimum: 0
        currency:
          type: string
          pattern: ^[A-Z]{3}$
      additionalProperties: false
    OrderSnapshot:
      type: object
      required:
      - order_id
      - status
      - total
      - version
      properties:
        order_id:
          type: string
        status:
          type: string
        total:
          $ref: '#/components/schemas/Money'
        version:
          type: integer
          minimum: 1
      additionalProperties: true
    MetricResult:
      type: object
      required:
      - metric_id
      - numerator
      - denominator
      - value
      - rank
      - ranking_eligible
      - quality
      - quality_issues
      - excluded_reasons
      - default_ranking_candidate
      - definition_status
      - coverage
      - sample_size
      - as_of
      - watermarks
      - versions
      - evidence_refs
      properties:
        metric_id:
          type: string
          enum:
          - return_application_item_rate
          - return_passed_item_rate
          - refund_successful_line_rate
          - refund_goods_amount_rate
        numerator:
          type: integer
          minimum: 0
        denominator:
          type: integer
          minimum: 0
        value:
          type:
          - number
          - 'null'
        rank:
          type:
          - integer
          - 'null'
          minimum: 1
        ranking_eligible:
          type: boolean
        quality:
          type: string
          enum:
          - complete
          - provisional
          - incomplete
          - blocked
        quality_issues:
          type: array
          items:
            type: string
        excluded_reasons:
          type: array
          items:
            type: string
        default_ranking_candidate:
          type: boolean
        definition_status:
          type: string
          enum:
          - pending_business_finance_approval
          - approved
        coverage:
          type: number
          minimum: 0
          maximum: 1
        sample_size:
          type: integer
          minimum: 0
        as_of:
          type: string
          format: date-time
        watermarks:
          type: object
          additionalProperties:
            type: string
            format: date-time
        versions:
          type: object
          required:
          - metric_version
          - ontology_version
          - mapping_version
          - projection_snapshot_id
          properties:
            metric_version:
              type: string
            ontology_version:
              type: string
            mapping_version:
              type: string
            projection_snapshot_id:
              type: string
          additionalProperties: false
        evidence_refs:
          type: array
          items:
            type: string
      additionalProperties: false
    MetricResults:
      type: object
      required:
      - results
      properties:
        results:
          type: array
          items:
            $ref: '#/components/schemas/MetricResult'
      additionalProperties: false
    InvestigationRequest:
      type: object
      required:
      - anomaly_type
      - window_start
      - window_end
      - filters
      properties:
        anomaly_type:
          type: string
          enum:
          - business_metric
          - cross_system_conflict
          - runtime_failure
        window_start:
          type: string
          format: date-time
        window_end:
          type: string
          format: date-time
        metric_id:
          type: string
        filters:
          type: object
          properties:
            product_id:
              type: string
            sku_id:
              type: string
            source_system:
              type: string
            correlation_id:
              type: string
            trace_id:
              type: string
            operation_id:
              type: string
            reason_code:
              type: string
          additionalProperties: false
      additionalProperties: false
    InvestigationRevisionRequest:
      type: object
      required:
